spring.application.name=card-payment-simulator

# DB（ADR 0011）。値は環境変数で渡す。初期値は compose.yaml の開発用の値と合わせる
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:card_payment}
spring.datasource.username=${DB_USERNAME:card_payment}
spring.datasource.password=${DB_PASSWORD:card_payment}

# デプロイ後の確認用に /actuator/health だけを公開する。DB などの部品ごとの状態も返す（詳細は返さない）
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
