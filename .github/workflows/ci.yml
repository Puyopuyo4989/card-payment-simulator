name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 最小限の権限にする（リポジトリの読み取りだけ）
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # ふだんは1分以内に終わる（キャッシュあり）。キャッシュが切れて依存を取り直す分も見て、余裕を持たせる
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java 25（Temurin）を用意する
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          # ~/.m2/repository をキャッシュする。
          # frontend-maven-plugin がダウンロードする Node.js も ~/.m2/repository に置かれるので、これでキャッシュされる
          cache: maven
          cache-dependency-path: pom.xml

      - name: ビルド・テスト・カバレッジを確認する
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # テストに通った jar を deploy のジョブに渡す（Build once。ADR 0009）
      - name: jar を deploy のジョブに渡す
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-jar
          # *.jar.original（repackage の前の jar）は含めない
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

  # main への push で、verify が成功したときだけ EC2 に反映する（ADR 0009）
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # SSM の待ち（最大で約10分）に、イメージの build・push の分を足した長さ
    timeout-minutes: 15
    # デプロイが同時に2つ動かないようにする。途中のデプロイは止めずに、終わるのを待つ
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      # GHCR にイメージを push する
      packages: write
      # OIDC で AWS のロールを引き受ける
      id-token: write
    env:
      IMAGE: ghcr.io/puyopuyo4989/card-payment-simulator
    steps:
      # Dockerfile と .dockerignore を使う
      - name: リポジトリを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: verify のジョブで作った jar を受け取る
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-jar
          path: target

      - name: GHCR にログインする
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: イメージを作って GHCR に push する
        run: |
          # source のラベルで、GHCR のパッケージをこのリポジトリにつなげる
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: OIDC で AWS のロールを引き受ける
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SSM で EC2 に反映する
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          # EC2 の中で動かすコマンド。compose.prod.yaml はこのコミットのものを取ってくる
          # （リポジトリは Public なので、認証なしで取れる）
          commands=$(jq --null-input --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '{commands: [
            "set -eu",
            "cd /opt/card-payment-simulator",
            "curl --fail --silent --show-error --location --output compose.prod.yaml.tmp https://raw.githubusercontent.com/\($repo)/\($sha)/compose.prod.yaml",
            "mv compose.prod.yaml.tmp compose.prod.yaml",
            "export IMAGE_TAG=\($sha)",
            "docker compose -f compose.prod.yaml pull",
            "docker compose -f compose.prod.yaml up -d",
            "for i in $(seq 1 30); do if curl --fail --silent http://localhost:8080/actuator/health | grep -q \"\\\"status\\\":\\\"UP\\\"\"; then echo \"health: UP\"; exit 0; fi; sleep 5; done",
            "echo \"health が UP になりませんでした\" >&2",
            "docker compose -f compose.prod.yaml logs --tail 100 app >&2",
            "exit 1"
          ], executionTimeout: ["600"]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters "$commands" \
            --query Command.CommandId --output text)
          echo "SSM のコマンド ID：$command_id"

          # 結果を待つ。aws ssm wait は約100秒で打ち切られるので、自分で待つ（最大で約10分）
          # 待ち時間と executionTimeout（600秒）は、初回のデプロイにかかった時間を見てから縮める
          status=Pending
          for i in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true

          echo "SSM のコマンドの結果：$status"
          test "$status" = Success
